<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DragCave Egg Identifier</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <h1>DragCave Egg Identifier</h1>
      <label class="field" for="eventSelector">
        <span>Event</span>
        <select id="eventSelector">
          <option value="none">None</option>
          <option value="totget">Halloween</option>
          <option value="easterget">Easter</option>
        </select>
      </label>
      <h2>Toggle egg information display</h2>
      <label class="infoDisplay" for="displayRelease">
        <input type="checkbox" id="displayRelease" checked />
        <span>Release date</span>
      </label>
      <label class="infoDisplay" for="displayElement">
        <input type="checkbox" id="displayElement" checked />
        <span>Elemental affinity</span>
      </label>
      <label class="infoDisplay" for="displayHabitat">
        <input type="checkbox" id="displayHabitat" checked />
        <span>Habitat</span>
      </label>
      <label class="infoDisplay" for="displayMorphology">
        <input type="checkbox" id="displayMorphology" checked />
        <span>Morphology</span>
      </label>
      <label class="infoDisplay" for="displayPrice">
        <input type="checkbox" id="displayPrice" checked />
        <span>Market price</span>
      </label>
      <label class="infoDisplay" for="displayURL">
        <input type="checkbox" id="displayURL" checked />
        <span>URL</span>
      </label>
      <p id="message">Checking active tab...</p>
    </main>
    <script src="logic.js"></script>
  </body>
</html>
