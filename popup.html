<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DragCave Egg Identifier</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <h1>DragCave Egg Identifier</h1>
      <label class="field" for="eventSelector">
        <span>Event</span>
        <select id="eventSelector">
          <option value="none">None</option>
          <option value="totget">Halloween</option>
          <option value="easterget">Easter</option>
        </select>
      </label>
      <h2>Toggle egg information display</h2>
      <div class="infoDisplay">
        <input type="checkbox" id="displayRelease" checked />
        <label for="displayRelease">Release date</label>
      </div>
      <div class="infoDisplay">
        <input type="checkbox" id="displayElement" checked />
        <label for="displayElement">Elemental affinity</label>
      </div>
      <div class="infoDisplay">
        <input type="checkbox" id="displayHabitat" checked />
        <label for="displayHabitat">Habitat</label>
      </div>
      <div class="infoDisplay">
        <input type="checkbox" id="displayMorphology" checked />
        <label for="displayMorphology">Morphology</label>
      </div>
      <div class="infoDisplay">
        <input type="checkbox" id="displayPrice" checked />
        <label for="displayPrice">Market price</label>
      </div>
      <div class="infoDisplay">
        <input type="checkbox" id="displayURL" checked />
        <label for="displayURL">URL</label>
      </div>
      <h3>
        Found an issue?
        <span>
          Email me:
          <a href="mailto:666de666@gmail.com">666de666@gmail.com</a>
        </span>
      </h3>
      <p id="message">Checking active tab...</p>
    </main>
    <script src="logic.js"></script>
  </body>
</html>
